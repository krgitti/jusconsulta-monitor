services:
  - type: web
    name: jusconsulta-monitor
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CRON_SCHEDULE
        value: "0 */4 * * *"
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
